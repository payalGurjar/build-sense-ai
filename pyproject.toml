[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "Python dependencies for the BuildSense FastAPI service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "google-genai>=2.33.0",
    "httpx>=0.28.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false
